# ============================================================
# llm-inference-bench 一键部署
#
#   docker compose up -d
#
# 起来的东西：
#   - bench-api   压测服务（:8080）
#   - prometheus  指标存储（:9090）
#   - grafana     监控面板（:3000，admin/admin）
#
# 被测的 vLLM / Ollama 不在本 compose 里，它们是外部依赖：
# 在 compose 网络内可用 host.docker.internal 指到宿主机。
# ============================================================

services:
  bench-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: llmbench-api
    ports:
      - "8080:8080"
    environment:
      # 指到宿主机的推理服务；容器内 localhost 不是宿主机
      VLLM_BASE_URL: ${VLLM_BASE_URL:-http://host.docker.internal:8000}
      VLLM_MODEL: ${VLLM_MODEL:-Qwen2.5-72B-Instruct}
      VLLM_QUANT: ${VLLM_QUANT:-fp16}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      OLLAMA_QUANT: ${OLLAMA_QUANT:-q4_K_M}
      BENCH_CONCURRENCY_LEVELS: ${BENCH_CONCURRENCY_LEVELS:-1,2,4,8,16,32}
      BENCH_MAX_TOKENS: ${BENCH_MAX_TOKENS:-256}
      # 容器内默认无 GPU，显存监控自动降级；需要时挂载 nvidia 运行时
      MONITOR_ENABLED: ${MONITOR_ENABLED:-false}
      API_HOST: 0.0.0.0
      API_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ../data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: llmbench-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: llmbench-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      # 允许匿名只读，方便演示时直接打开
      GF_AUTH_ANONYMOUS_ENABLED: ${GF_ANON:-true}
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
