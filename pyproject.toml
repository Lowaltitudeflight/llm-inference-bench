[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-inference-bench"
version = "0.1.0"
description = "Benchmark self-hosted LLM inference across engines and quantisation levels"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lowaltitudeflight" }]
keywords = ["llm", "benchmark", "vllm", "ollama", "quantization", "ttft", "tpot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.30,<3",
    "httpx>=0.27,<1",
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<7",
    "ruff>=0.6,<1",
]

[project.scripts]
llmbench = "scripts.run_bench:main"

[project.urls]
Homepage = "https://github.com/Lowaltitudeflight/llm-inference-bench"

# The packages keep their historical top-level names (config/, metrics/, ...).
# Renaming them to a single namespace would break every documented command and
# import in one commit; it is tracked as a follow-up rather than done here.
[tool.setuptools]
packages = ["api", "bench", "config", "engines", "metrics", "monitor", "report", "scripts"]
