[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
markers =
    gpu: 需要 NVIDIA GPU / nvidia-smi 的测试
    network: 需要联网或真实推理服务的测试
    slow: 运行较慢的测试
filterwarnings =
    ignore::DeprecationWarning
